<style>
.ls-mess{opacity:0}.ls-card,.ls-hub,.ls-tag,.ls-in,.ls-bar,.ls-line,.ls-dot,.ls-rev,.ls-done,.ls-ring,.ls-sync{transform-box:fill-box;transform-origin:center}
.ls-done{opacity:1}.ls-rev{opacity:0}
.laptop .ls-mess{animation:ls-mess 15s infinite}
.laptop .ls-card{animation:ls-card 15s infinite cubic-bezier(.6,0,.4,1)}
.laptop .ls-tag{animation:ls-tag 15s infinite}
.laptop .ls-hub{animation:ls-hub 15s infinite}
.laptop .ls-ring{animation:ls-ring 1.5s infinite ease-out}.laptop .ls-ring2{animation-delay:.75s}
.laptop .ls-bar{transform-origin:left;transform-box:fill-box;animation:ls-bar 15s infinite}
.laptop .ls-in{animation:ls-in 15s infinite}.laptop .ls-d2{animation-name:ls-in2}.laptop .ls-d3{animation-name:ls-in3}
.laptop .ls-line{stroke-dasharray:1;animation:ls-line 15s infinite}
.laptop .ls-dot{animation:ls-dot 15s infinite}
.laptop .ls-rev{animation:ls-rev 15s infinite}.laptop .ls-done{animation:ls-done 15s infinite}
.laptop .ls-sync{animation:ls-sync 2s infinite}
@keyframes ls-mess{0%,46%{opacity:1}50%,97%{opacity:0}100%{opacity:1}}
