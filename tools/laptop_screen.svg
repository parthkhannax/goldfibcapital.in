@keyframes ls-tag{0%,6%{opacity:0}10%,26%{opacity:1}30%,100%{opacity:0}}
@keyframes ls-hub{0%,28%{opacity:0;transform:scale(.6)}33%,44%{opacity:1;transform:none}49%,100%{opacity:0;transform:scale(1.1)}}
@keyframes ls-ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes ls-bar{0%,32%{transform:scaleX(0)}44%,100%{transform:scaleX(1)}}
@keyframes ls-in{0%,47%{opacity:0;transform:translateY(10px)}53%,100%{opacity:1;transform:none}}
@keyframes ls-in2{0%,50%{opacity:0;transform:translateY(10px)}56%,100%{opacity:1;transform:none}}
@keyframes ls-in3{0%,53%{opacity:0;transform:translateY(10px)}59%,100%{opacity:1;transform:none}}
@keyframes ls-line{0%,55%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@keyframes ls-dot{0%,69%{opacity:0;transform:scale(0)}73%,100%{opacity:1;transform:none}}
@keyframes ls-rev{0%,76%{opacity:1}78%,100%{opacity:0}}
@keyframes ls-done{0%,76%{opacity:0;transform:scale(.8)}79%,100%{opacity:1;transform:none}}
@keyframes ls-sync{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.laptop [class^=ls-],.laptop [class*=" ls-"]{animation:none!important}}
